<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0E7847" />
      <stop offset="60%" stop-color="#0A5C36" />
      <stop offset="100%" stop-color="#042314" />
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#F4E08B" />
    </linearGradient>

    <!-- Inner Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Ornate Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="24 10" opacity="0.9" />
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- Decorative Corner Arabesque Accents -->
  <circle cx="56" cy="56" r="10" fill="url(#goldGrad)" />
  <circle cx="456" cy="56" r="10" fill="url(#goldGrad)" />
  <circle cx="56" cy="456" r="10" fill="url(#goldGrad)" />
  <circle cx="456" cy="456" r="10" fill="url(#goldGrad)" />

  <!-- Central Crescent & Star with Golden Glow -->
  <g transform="translate(256, 210) scale(1.2)" filter="url(#goldGlow)">
    <!-- Crescent Moon -->
    <path d="M 0,-95 A 95,95 0 1,0 85,60 A 80,80 0 1,1 0,-95 Z" fill="url(#goldGrad)" transform="rotate(-20)" />

    <!-- 5-Pointed Star -->
    <polygon points="45,-45 52,-28 70,-28 55,-16 61,0 45,-10 29,0 35,-16 20,-28 38,-28" fill="url(#goldGrad)" />
  </g>

  <!-- Open Quran Holy Book Illustration -->
  <g transform="translate(256, 385)">
    <!-- Book Stand (Rehal) Base -->
    <path d="M -90,45 L 0,0 L 90,45 L 60,65 L 0,30 L -60,65 Z" fill="#042314" stroke="url(#goldGrad)" stroke-width="3.5" />

    <!-- Left Page -->
    <path d="M -10,-10 C -50,-20 -100,-15 -135,-35 C -135,15 -135,35 -135,40 C -100,55 -50,45 -10,60 Z" fill="#FDFBF4" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Right Page -->
    <path d="M 10,-10 C 50,-20 100,-15 135,-35 C 135,15 135,35 135,40 C 100,55 50,45 10,60 Z" fill="#FDFBF4" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Book Spine Ribbon -->
    <path d="M -6,-15 L 6,-15 L 4,68 L -4,68 Z" fill="url(#goldGrad)" />

    <!-- Quran Ayah Lines (Decorative Calligraphy Simulation) -->
    <line x1="-120" y1="-18" x2="-25" y2="-2" stroke="#AA820A" stroke-width="3" stroke-linecap="round" />
    <line x1="-115" y1="2" x2="-25" y2="18" stroke="#AA820A" stroke-width="3" stroke-linecap="round" />
    <line x1="-120" y1="22" x2="-25" y2="38" stroke="#AA820A" stroke-width="3" stroke-linecap="round" />

    <line x1="25" y1="-2" x2="120" y2="-18" stroke="#AA820A" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="18" x2="115" y2="2" stroke="#AA820A" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="38" x2="120" y2="22" stroke="#AA820A" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
